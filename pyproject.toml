[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "semiconductor-quality-lab"
version = "0.1.0"
description = "Reproducible SECOM failure-prediction research and inspection tools"
requires-python = ">=3.11,<3.14"
dependencies = ["numpy>=2.2,<2.4", "pandas>=2.2,<2.4", "scikit-learn>=1.7,<1.10", "scipy>=1.14,<1.19", "joblib>=1.4,<1.6", "matplotlib>=3.10,<3.12"]

[project.optional-dependencies]
full = ["xgboost>=3.1,<3.5", "shap>=0.49,<0.52", "mlflow>=3.5,<4", "fastapi>=0.120,<1", "uvicorn>=0.38,<1", "streamlit>=1.50,<2", "plotly>=6.3,<7", "httpx>=0.28,<1"]
dev = ["pytest>=8.4,<10", "ruff>=0.14,<1"]
cloud = ["google-cloud-bigquery>=3.38,<4", "pyarrow>=18"]

[project.scripts]
secom-lab = "secom_lab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
secom_lab = ["web.html"]

[tool.ruff]
line-length = 110

[tool.pytest.ini_options]
testpaths = ["tests"]
