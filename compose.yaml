services:
  api:
    build: .
    command: uvicorn secom_lab.api:app --host 0.0.0.0 --port 8000
    ports: ["127.0.0.1:8000:8000"]
    volumes: ["./artifacts:/app/artifacts:ro"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
  dashboard:
    build: .
    command: streamlit run src/secom_lab/dashboard.py --server.address 0.0.0.0 --server.port 8501
    ports: ["127.0.0.1:8501:8501"]
    environment:
      SECOM_API_URL: http://api:8000
    volumes: ["./artifacts:/app/artifacts:ro"]
    depends_on:
      api:
        condition: service_healthy
